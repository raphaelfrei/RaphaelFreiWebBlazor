<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Gradiente de fundo inspirado no tema escuro do app -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1C29" />
      <stop offset="100%" stop-color="#0D0E15" />
    </linearGradient>
  </defs>

  <!-- Background base -->
  <rect width="1024" height="1024" fill="url(#bg)" />

  <!-- Grid 3x3 centralizado -->
  <g transform="translate(232, 232)">
    <!-- Linha 1 -->
    <rect x="0" y="0" width="160" height="160" rx="40" fill="#FF4757" />
    <rect x="200" y="0" width="160" height="160" rx="40" fill="#2A2B3D" />
    <rect x="400" y="0" width="160" height="160" rx="40" fill="#00D2D3" />

    <!-- Linha 2 -->
    <rect x="0" y="200" width="160" height="160" rx="40" fill="#2A2B3D" />
    <rect x="200" y="200" width="160" height="160" rx="40" fill="#FECA57" />
    <rect x="400" y="200" width="160" height="160" rx="40" fill="#2A2B3D" />

    <!-- Linha 3 -->
    <rect x="0" y="400" width="160" height="160" rx="40" fill="#5F27CD" />
    <rect x="200" y="400" width="160" height="160" rx="40" fill="#2A2B3D" />
    <rect x="400" y="400" width="160" height="160" rx="40" fill="#2A2B3D" />
  </g>
</svg>
