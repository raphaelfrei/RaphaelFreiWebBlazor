<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n-title="Apps_PageTitle">Applications | Raphael Frei</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="description" content="My published applications." />
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="/css/pages.css" />
</head>
<body>
    <div class="page-wrapper">
        <header class="top-header">
            <div class="header-container">
                <a href="/" class="brand-logo"><span class="accent">~/</span>raphaelfrei</a>
                <nav class="header-nav">
                    <a href="/projects" class="nav-link" data-i18n="Nav_Projects">Projects</a>
                    <a href="/apps" class="nav-link" data-i18n="Nav_Applications">Applications</a>
                    <a href="/resume" class="nav-link" data-i18n="Nav_Resume">Resume</a>
                </nav>
            </div>
        </header>
        <main class="main-content">
            <div class="dev-container">
                <header class="page-header">
                    <h1 class="page-title"><span class="accent">ls</span> -la ./apps</h1>
                    <p class="page-subtitle" data-i18n="Apps_PageSubtitle">Applications I have developed and published in stores.</p>
                </header>

                <div class="app-list" id="apps-list">
                    <p><em><span class="accent">./</span><span data-i18n="Apps_Loading">Loading apps...</span></em></p>
                </div>
            </div>
        </main>
        <footer class="bottom-footer">
            <div class="footer-container">
                <div class="footer-info">
                    <p>© <span id="footer-year">2021 - 2026</span> Raphael Frei. All rights reserved.</p>
                    <p class="built-with">Built with <span class="accent">Vanilla JS</span>.</p>
                </div>
                <div class="footer-actions">
                    <div class="language-wrapper">
                        <div class="culture-selector">
                            <span class="terminal-comment">// lang:</span>
                            <a href="#" onclick="setLanguage('en'); return false;" class="lang-link" id="lang-en">en</a>
                            <span class="selector-separator">|</span>
                            <a href="#" onclick="setLanguage('pt'); return false;" class="lang-link" id="lang-pt">pt</a>
                            <span class="selector-separator">|</span>
                            <a href="#" onclick="setLanguage('es'); return false;" class="lang-link" id="lang-es">es</a>
                        </div>
                    </div>
                </div>
            </div>
        </footer>
    </div>
    <script src="/js/i18n.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
